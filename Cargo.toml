[package]
name = "fraud-detector"
version = "0.3.0"
edition = "2021"

[lib]
name = "fraud_detector"
path = "src/lib.rs"

[features]
default = ["submission"]
# Imagem Docker / Rinha: fast path conservador + k-NN exato.
submission = ["knn-index"]
knn-index = ["dep:memmap2"]

[dependencies]
libc = "0.2"
io-uring = "0.6"
memmap2 = { version = "0.9", optional = true }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
ureq = "2"
hostname = "0.4.2"

[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "build-index"
path = "src/bin/build_index.rs"
required-features = ["knn-index"]

[[bin]]
name = "healthcheck"
path = "src/bin/healthcheck.rs"

[[bin]]
name = "lb"
path = "src/lb.rs"

[[bin]]
name = "verify-fast"
path = "src/bin/verify_fast.rs"
required-features = ["knn-index"]

[[bin]]
name = "verify-knn-hot"
path = "src/bin/verify_knn_hot.rs"
required-features = ["knn-index"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false

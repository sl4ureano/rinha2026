# Mac Mini da prova (i5 Haswell, 2 núcleos / 4 threads):
#   CPU 0 + 1 = mesmo núcleo físico
#   CPU 2 + 3 = outro núcleo físico
#
# Pinagem (equalizada com lucasmontano/fksegundo):
#   api1 → CPU 0  (núcleo físico)
#   api2 → CPU 1  (mesmo núcleo, HT — ambos APIs nos cores rápidos)
#   lb   → CPU 2,3 (outro núcleo físico, só accept+fd-pass)
#
# Quota total: 0.40 + 0.40 + 0.20 = 1.00 CPU | 151+151+48+4 (tmpfs) = 354 MB

x-api: &api-common
  image: ghcr.io/sl4ureano/rinha2026:super
  pull_policy: always
  healthcheck:
    test: ["CMD", "/app/healthcheck"]
    interval: 1s
    timeout: 1s
    retries: 30
    start_period: 15s
  volumes:
    - sockets:/tmp/sockets
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  deploy:
    resources:
      limits:
        cpus: "0.40"
        memory: 151M
  logging:
    driver: none

services:
  api1:
    <<: *api-common
    command: ["./server", "/tmp/sockets/api1.sock"]
    cpuset: "0"
    network_mode: "none"

  api2:
    <<: *api-common
    command: ["./server", "/tmp/sockets/api2.sock"]
    cpuset: "1"
    network_mode: "none"

  lb:
    image: ghcr.io/sl4ureano/rinha2026:super
    pull_policy: always
    cpuset: "2,3"
    command: ["./lb"]
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    volumes:
      - sockets:/tmp/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 48M
    logging:
      driver: none
    networks:
      - rinha

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=4m,mode=0777

networks:
  rinha:
    driver: bridge

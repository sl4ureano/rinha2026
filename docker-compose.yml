x-app-build: &app-build
  context: .

services:
  lb:
    image: rinha2026:local
    build: *app-build
    command: ["./lb"]
    cpuset: "2,3"
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    volumes:
      - sockets:/tmp/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 48M
    logging:
      driver: none
    networks:
      - rinha

  api1:
    image: rinha2026:local
    build: *app-build
    command: ["./server", "/tmp/sockets/api1.sock"]
    cpuset: "0"
    network_mode: "none"
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 15s
    volumes:
      - sockets:/tmp/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 151M
    logging:
      driver: none

  api2:
    image: rinha2026:local
    build: *app-build
    command: ["./server", "/tmp/sockets/api2.sock"]
    cpuset: "1"
    network_mode: "none"
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 15s
    volumes:
      - sockets:/tmp/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 151M
    logging:
      driver: none

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=4m,mode=0777

networks:
  rinha:
    driver: bridge
